name: Laravel Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: senet_pathshala_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Resolve Composer dependencies without scripts
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Verify Laravel framework autoload
        run: |
          test -f vendor/laravel/framework/src/Illuminate/Foundation/Application.php
          php -r "require 'vendor/autoload.php'; exit(class_exists('Illuminate\\Foundation\\Application') ? 0 : 1);"
      - name: Prepare environment
        run: cp .env.example .env
      - name: Generate application key
        run: php artisan key:generate
      - name: Configure test database
        run: |
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=senet_pathshala_test/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
      - name: Run migrations
        run: php artisan migrate --force
      - name: Seed test database
        run: php artisan db:seed --force
      - name: Run tests
        run: php artisan test
